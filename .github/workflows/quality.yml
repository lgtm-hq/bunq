---
name: Quality

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: >-
    quality-${{ github.event_name == 'pull_request' &&
    github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0 # v0.79.2
    permissions:
      contents: read
      packages: read
    with:
      # Released image for the locally pinned Lintro; digest cannot be wrapped.
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:116e60912a8c7a2002349ef096cfa93644314492751746aacdd5ef228c74306f
      egress-policy: block
      allowed-endpoints-mode: append
      allowed-endpoints: >-
        results-receiver.actions.githubusercontent.com:443
        *.blob.core.windows.net:443
